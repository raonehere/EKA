name = "eka-booking"
main = "index.js"
compatibility_date = "2025-01-01"

# Public, non-secret settings. Secrets are set with `wrangler secret put`.
[vars]
ALLOWED_ORIGINS = "https://ekaforest.com,https://www.ekaforest.com,http://localhost:8080"
UNITS = "11"
TENT_CAPACITY = "2"
ADVANCE_PERCENT = "20"
SITE_URL = "https://ekaforest.com"
CHANGE_CUTOFF_HOURS = "48"

# The UPI ID that receives the advance. Bookings are refused while empty.
UPI_ID = "eka.82200883@hdfcbank"
UPI_NAME = "EKA"
